<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <style>
        body {
            margin: 0;
            font-family: Georgia, 'Times New Roman', Times, serif;
            background: linear-gradient(135deg, #fff2f8, #ffe9f2);
            color: #7d3354;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .thank-you-card {
            background: #fffafc;
            border: 1px solid #f2bed1;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(255, 105, 180, 0.16);
            padding: 36px;
            max-width: 500px;
            text-align: center;
        }

        .thank-you-card h1 {
            margin: 0 0 12px;
            font-size: 2rem;
            color: #d96a9b;
        }

        .thank-you-card p {
            margin: 0 0 16px;
            line-height: 1.6;
            color: #8a4f6b;
        }

        .button {
            display: inline-block;
            background-color: pink;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 999px;
            transition: 0.3s ease;
        }

        .button:hover {
            background-color: #ff8db7;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="thank-you-card">
        <h1>Thank You!</h1>
        <p>Thank you for filling out today's daily intake form. Have an amazing day!</p>
        <a class="button" href="index.html">Back to Form</a>
    </div>
</body>
</html>
